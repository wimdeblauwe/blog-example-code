<!DOCTYPE html>
<html th:lang="|${#locale.language}-${#locale.country}|"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      th:fragment="layout(content)"
      th:with="title=${title} ?: ~{::title},scriptContent=${scriptContent} ?: ~{}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="${title}"></th:block>
    <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
    <th:block th:replace="~{sl/layout :: assets}"></th:block>
    <vite:client></vite:client>
    <vite:vite>
        <vite:entry value="/css/application.css"></vite:entry>
    </vite:vite>

    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</head>
<body>
<header>
    <sl:theme-toggle></sl:theme-toggle>
    <sl:button variant="outline">Example button</sl:button>
</header>
<main th:replace="${content}">
</main>

<th:block th:replace="${scriptContent}">

</th:block>
</body>
<template>
    <title>My application</title>
</template>
</html>
